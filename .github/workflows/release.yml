name: Publish JayFlow release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact matching v<VERSION> tag
        required: true
        default: v2.0.33-dev
        type: string
      version:
        description: Version without v prefix (X.Y.Z or X.Y.Z-dev; each Windows component <= 65535)
        required: true
        default: 2.0.33-dev
        type: string

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  build_windows:
    name: Validate and build Windows without the signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      ref: ${{ steps.inputs.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the public release repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: release
          persist-credentials: false

      - name: Validate release inputs
        id: inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-dev, without a v prefix or leading zeroes"
            exit 1
          fi
          VERSION_CORE="${INPUT_VERSION%-dev}"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION_CORE"
          for COMPONENT in "$VERSION_MAJOR" "$VERSION_MINOR" "$VERSION_PATCH"; do
            if [ "${#COMPONENT}" -gt 5 ] || (( 10#$COMPONENT > 65535 )); then
              echo "::error::each Windows version component must be in 0..65535"
              exit 1
            fi
          done

          EXPECTED_TAG="v${INPUT_VERSION}"
          if [ "$INPUT_REF" != "$EXPECTED_TAG" ]; then
            echo "::error::ref must be exactly v${INPUT_VERSION}"
            exit 1
          fi

          printf 'version=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the private source at the validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: julubileu/jayflow-v2
          ref: ${{ steps.inputs.outputs.ref }}
          ssh-key: ${{ secrets.JAYFLOW_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false

      - name: Record and verify source identity
        id: source
        working-directory: source
        env:
          SOURCE_REF: ${{ steps.inputs.outputs.ref }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${SOURCE_REF}^{commit}")"
          if [ "$SOURCE_SHA" != "$TAG_SHA" ] || [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::checkout HEAD does not resolve from the exact requested tag"
            exit 1
          fi
          git diff --check
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::source checkout contains untracked files"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::source checkout is dirty"
            exit 1
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Derive the reproducible source epoch
        working-directory: source
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_SHA")"
          if [[ ! "$SOURCE_DATE_EPOCH" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::source commit has no valid positive commit epoch"
            exit 1
          fi
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      - name: Set up Go from the private source go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/cmd/jayflow/frontend/package-lock.json

      - name: Build the trusted public auditor
        working-directory: release
        run: |
          set -euo pipefail
          go test ./cmd/release-tool
          go build -trimpath -o "$RUNNER_TEMP/jayflow-release-tool" ./cmd/release-tool

      - name: Install NSIS and expose the runner browser as Chromium
        run: |
          set -euo pipefail
          NSIS_PACKAGE_VERSION=3.09-4ubuntu1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "nsis=$NSIS_PACKAGE_VERSION"
          if [ "$(dpkg-query -W -f='${Version}' nsis)" != "$NSIS_PACKAGE_VERSION" ]; then
            echo "::error::installed NSIS package differs from the pinned Ubuntu 24.04 version"
            exit 1
          fi
          makensis -VERSION

          CHROMIUM_SOURCE=""
          for CANDIDATE in \
            /usr/bin/google-chrome-stable \
            /usr/bin/google-chrome \
            /usr/bin/chromium; do
            if [ -x "$CANDIDATE" ]; then
              CHROMIUM_SOURCE="$CANDIDATE"
              break
            fi
          done
          if [ -z "$CHROMIUM_SOURCE" ]; then
            echo "::error::the official GitHub runner image has no supported Chromium/Chrome executable"
            exit 1
          fi
          if [ "$CHROMIUM_SOURCE" != /usr/bin/chromium ]; then
            sudo ln -sfn -- "$CHROMIUM_SOURCE" /usr/bin/chromium
          fi
          /usr/bin/chromium --version

      - name: Install frontend dependencies and Wails v2.14.0
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --prefix cmd/jayflow/frontend --ignore-scripts --no-audit --no-fund
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Audit pinned Wails NSIS user-scope semantics
        working-directory: source
        run: |
          set -euo pipefail
          WAILS_ROOT="$(go env GOPATH)/pkg/mod/github.com/wailsapp/wails/v2@v2.14.0"
          NSIS_BUILDER="$WAILS_ROOT/pkg/commands/build/nsis_installer.go"
          NSIS_TEMPLATE="$WAILS_ROOT/pkg/buildassets/build/windows/installer/project.nsi"
          grep -Fq 'args = append(args, "-DARG_WAILS_AMD64_BINARY="+amd64Binary)' "$NSIS_BUILDER"
          grep -Fq 'args = append(args, "-DWAILS_INSTALL_SCOPE=user")' "$NSIS_BUILDER"
          grep -Fq 'args = append(args, "-DREQUEST_EXECUTION_LEVEL=user")' "$NSIS_BUILDER"
          grep -Fq 'InstallDir "$LOCALAPPDATA\Programs\${INFO_PRODUCTNAME}"' "$NSIS_TEMPLATE"
          grep -Fq 'VIProductVersion "${INFO_PRODUCTVERSION}.0"' "$NSIS_TEMPLATE"
          grep -Fq 'VIFileVersion    "${INFO_PRODUCTVERSION}.0"' "$NSIS_TEMPLATE"

      - name: Prepare the private source gate environment
        env:
          STRACE_URL: https://github.com/strace/strace/releases/download/v7.1/strace-7.1.tar.xz
          STRACE_SHA256: 81743ecf2a5b44186b2f5038afdc8beda7e5c70aed15b4fbfbcc6e9ece24490f
          STRACE_VERSION_LINE: strace -- version 7.1
          GATE_ROOT: ${{ runner.temp }}/jayflow-gate
        run: |
          set -euo pipefail

          STRACE_PREFIX="$RUNNER_TEMP/strace-7.1"
          STRACE_BIN="$STRACE_PREFIX/bin/strace"
          STRACE_SRC="$(mktemp -d)"
          trap 'rm -rf "$STRACE_SRC"' EXIT

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$STRACE_SRC/strace-7.1.tar.xz" "$STRACE_URL"
          printf '%s  %s\n' "$STRACE_SHA256" "$STRACE_SRC/strace-7.1.tar.xz" > "$STRACE_SRC/SHA256SUMS"
          sha256sum -c --strict "$STRACE_SRC/SHA256SUMS"

          tar -xf "$STRACE_SRC/strace-7.1.tar.xz" -C "$STRACE_SRC"
          (
            cd "$STRACE_SRC/strace-7.1"
            ./configure --prefix="$STRACE_PREFIX" --enable-mpers=no
            make -j"$(nproc)"
            make install
          )

          STRACE_VERSION_OUTPUT="$("$STRACE_BIN" -V)"
          BUILT_VERSION_LINE="$(printf '%s\n' "$STRACE_VERSION_OUTPUT" | head -1)"
          if [ "$BUILT_VERSION_LINE" != "$STRACE_VERSION_LINE" ]; then
            echo "::error::built tracer reports ${BUILT_VERSION_LINE}, want the pinned ${STRACE_VERSION_LINE}"
            exit 1
          fi
          MACHINE="$(uname -m)"
          if [ "$MACHINE" != x86_64 ]; then
            echo "::error::the pinned syscall table only covers x86_64, this runner is ${MACHINE}"
            exit 1
          fi

          mkdir -p "$GATE_ROOT/tasks"
          chmod 700 "$GATE_ROOT" "$GATE_ROOT/tasks"

          if ! unshare -U true; then
            RESTRICTED="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
            if [ "$RESTRICTED" = 1 ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if ! unshare -U true; then
              echo "::error::unprivileged CLONE_NEWUSER is unavailable, so the private gates cannot be proven"
              exit 1
            fi
          fi

          printf '%s\n' "$STRACE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Gate 1 - release regression
        working-directory: source
        run: |
          set -euo pipefail
          bash tests/release-build-regression.sh

      - name: Gate 2 - Go tests
        working-directory: source
        env:
          JAYFLOW_LOCAL_GATE_ROOT: ${{ runner.temp }}/jayflow-gate
        run: |
          set -euo pipefail
          go test -count=1 ./...

      - name: Gate 3 - Go race detector
        working-directory: source
        env:
          JAYFLOW_LOCAL_GATE_ROOT: ${{ runner.temp }}/jayflow-gate
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

      - name: Gate 4 - Windows vet
        working-directory: source
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...

      - name: Gate 5 - Windows build
        working-directory: source
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

      - name: Gate 6 - Linux build
        working-directory: source
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...

      - name: Gate 7 - Go vet
        working-directory: source
        run: |
          set -euo pipefail
          go vet ./...

      - name: Gate 8 - diff check
        working-directory: source
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code

      - name: Gate 9 - all frontend and mobile tests, sequentially
        working-directory: source/cmd/jayflow/frontend
        run: |
          set -euo pipefail
          mapfile -d '' -t TEST_FILES \
            < <(find scripts -maxdepth 1 -type f -name '*.test.mjs' -print0 | sort -z)
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::no frontend test files were found"
            exit 1
          fi
          for TEST_FILE in "${TEST_FILES[@]}"; do
            node "$TEST_FILE"
          done
          SHOTS_DIR="$(mktemp -d)"
          trap 'rm -rf "$SHOTS_DIR"' EXIT
          node scripts/mobile-shots.mjs "$SHOTS_DIR"

      - name: Build and audit the embedded Linux daemon
        working-directory: source
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p cmd/jayflow/embedded
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o cmd/jayflow/embedded/jayflowd ./cmd/jayflowd
          "$RUNNER_TEMP/jayflow-release-tool" audit-daemon \
            -version "$VERSION" \
            -path cmd/jayflow/embedded/jayflowd

      - name: Build the stamped Windows app and NSIS installer twice
        working-directory: source/cmd/jayflow
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUBLIC_KEY: ${{ vars.JAYFLOW_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::JAYFLOW_RELEASE_PUBLIC_KEY is not configured"
            exit 1
          fi
          stamp_windows_metadata() {
            node - "$VERSION" "$SOURCE_SHA" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const sourceSHA = process.argv[3];
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-dev)?$/.exec(version);
          if (!match || match.slice(1, 4).some((value) => Number(value) > 65535)) {
            throw new Error('release version is outside the Windows X.Y.Z bounds');
          }
          if (!/^[0-9a-f]{40}$/.test(sourceSHA)) {
            throw new Error('source SHA must be a lowercase 40-character commit SHA');
          }
          const productVersion = `${match[1]}.${match[2]}.${match[3]}`;
          const path = 'wails.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.info || typeof config.info !== 'object') {
            throw new Error('wails.json has no info object');
          }
          config.info.productVersion = productVersion;
          config.info.comments = `source_sha=${sourceSHA}`;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          }

          stamp_windows_metadata
          build_windows_app() {
            wails build "$@" -platform windows/amd64 -webview2 download -installscope user -trimpath \
              -ldflags "-X main.DaemonVersion=${VERSION} -X main.AppVersion=${VERSION} -X github.com/julubileu/jayflow-v2/internal/updater.PublicKeyBase64=${PUBLIC_KEY}"
          }

          NSIS_PROJECT="build/windows/installer/project.nsi"
          NSIS_TOOLS="build/windows/installer/wails_tools.nsh"
          NSIS_BOOTSTRAPPER="build/windows/installer/tmp/MicrosoftEdgeWebview2Setup.exe"

          audit_nsis_project() {
            for GENERATED_INPUT in "$NSIS_PROJECT" "$NSIS_TOOLS" "$NSIS_BOOTSTRAPPER"; do
              if [ ! -f "$GENERATED_INPUT" ]; then
                echo "::error::Wails did not generate required NSIS input $GENERATED_INPUT"
                exit 1
              fi
            done

            mapfile -t DATE_SAVE_DIRECTIVES \
              < <(grep -nE '^[[:space:]]*SetDateSave([[:space:]]|$)' "$NSIS_PROJECT" || true)
            if [ "${#DATE_SAVE_DIRECTIVES[@]}" -ne 1 ] \
              || [ "${DATE_SAVE_DIRECTIVES[0]}" != "2:SetDateSave off" ]; then
              echo "::error::project.nsi must contain only exact line 2: SetDateSave off"
              printf 'SetDateSave directive: %s\n' "${DATE_SAVE_DIRECTIVES[@]:-none}" >&2
              exit 1
            fi

            mapfile -t TOOLS_INCLUDES \
              < <(grep -nFx '!include "wails_tools.nsh"' "$NSIS_PROJECT" || true)
            if [ "${#TOOLS_INCLUDES[@]}" -ne 1 ] \
              || (( ${TOOLS_INCLUDES[0]%%:*} <= 2 )); then
              echo "::error::SetDateSave off must precede the unique Wails tools include"
              exit 1
            fi
            grep -Fq 'File "/oname=${PRODUCT_EXECUTABLE}" "${ARG_WAILS_AMD64_BINARY}"' "$NSIS_TOOLS"
            grep -Fq 'File "tmp\MicrosoftEdgeWebview2Setup.exe"' "$NSIS_TOOLS"
            if grep -qE '^[[:space:]]*SetDateSave([[:space:]]|$)' "$NSIS_TOOLS"; then
              echo "::error::wails_tools.nsh must not override the project SetDateSave policy"
              exit 1
            fi
          }

          make_nsis() {
            audit_nsis_project
            (
              cd "$(dirname "$NSIS_PROJECT")"
              makensis \
                "-DARG_WAILS_AMD64_BINARY=../../bin/JayFlow.exe" \
                -DWAILS_INSTALL_SCOPE=user \
                -DREQUEST_EXECUTION_LEVEL=user \
                project.nsi
            )
            if [ ! -f "$NSIS_OUTPUT" ]; then
              echo "::error::manual makensis did not produce the canonical amd64 installer"
              exit 1
            fi
          }

          FIRST_BUILD_DIR="$RUNNER_TEMP/first-windows-build"
          mkdir "$FIRST_BUILD_DIR"
          rm -rf -- build/bin
          build_windows_app -nsis
          mapfile -d '' -t NSIS_OUTPUTS \
            < <(find build/bin -maxdepth 1 -type f -name '*-amd64-installer.exe' -print0)
          if [ "${#NSIS_OUTPUTS[@]}" -ne 1 ]; then
            echo "::error::initial Wails NSIS generation must produce exactly one disposable amd64 installer"
            printf 'Installer candidate: %s\n' "${NSIS_OUTPUTS[@]:-none}" >&2
            exit 1
          fi
          NSIS_OUTPUT="${NSIS_OUTPUTS[0]}"
          if grep -qE '^[[:space:]]*SetDateSave([[:space:]]|$)' "$NSIS_PROJECT"; then
            echo "::error::Wails-generated project.nsi unexpectedly already controls SetDateSave"
            exit 1
          fi
          sed -i '1a SetDateSave off' "$NSIS_PROJECT"
          audit_nsis_project
          rm -f -- "$NSIS_OUTPUT"
          make_nsis
          cp build/bin/JayFlow.exe "$FIRST_BUILD_DIR/JayFlow.exe"
          cp "$NSIS_OUTPUT" "$FIRST_BUILD_DIR/installer.exe"

          git restore --worktree -- wails.json frontend/wailsjs/go/models.ts
          stamp_windows_metadata
          rm -rf -- build/bin
          build_windows_app
          make_nsis
          if ! cmp -s "$FIRST_BUILD_DIR/JayFlow.exe" build/bin/JayFlow.exe; then
            echo "::error::portable Windows build is not byte-for-byte reproducible"
            exit 1
          fi
          if ! cmp -s "$FIRST_BUILD_DIR/installer.exe" "$NSIS_OUTPUT"; then
            echo "::error::NSIS setup build is not byte-for-byte reproducible"
            exit 1
          fi
          sha256sum "$FIRST_BUILD_DIR/JayFlow.exe" build/bin/JayFlow.exe \
            "$FIRST_BUILD_DIR/installer.exe" "$NSIS_OUTPUT"

      - name: Audit Wails-generated changes
        working-directory: source/cmd/jayflow
        run: |
          set -euo pipefail
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          (
            cd "$REPO_ROOT"
            git restore --worktree -- cmd/jayflow/wails.json
            sed -i 's/^[[:blank:]]*$//' cmd/jayflow/frontend/wailsjs/go/models.ts
            git diff --check
            git diff --exit-code

            mapfile -d '' -t UNTRACKED_FILES \
              < <(git ls-files --others --exclude-standard -z)
            if [ "${#UNTRACKED_FILES[@]}" -ne 0 ]; then
              echo "::error::Wails generated untracked non-ignored files"
              printf 'untracked: %s\n' "${UNTRACKED_FILES[@]}" >&2
              exit 1
            fi
          )

      - name: Stage and audit the exact unsigned release assets
        working-directory: source
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SOURCE_REF: ${{ steps.inputs.outputs.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUBLIC_KEY: ${{ vars.JAYFLOW_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir dist-windows
          cp cmd/jayflow/build/bin/JayFlow.exe "dist-windows/JayFlow-${VERSION}.exe"

          mapfile -d '' -t INSTALLERS \
            < <(find cmd/jayflow/build/bin -maxdepth 1 -type f -name '*-amd64-installer.exe' -print0)
          if [ "${#INSTALLERS[@]}" -ne 1 ]; then
            echo "::error::Wails must produce exactly one amd64 NSIS installer"
            printf 'installer candidate: %s\n' "${INSTALLERS[@]:-none}" >&2
            exit 1
          fi
          cp "${INSTALLERS[0]}" "dist-windows/JayFlow-${VERSION}-setup.exe"
          cp "${INSTALLERS[0]}" dist-windows/JayFlow-setup.exe

          WINDOWS_VERSION="${VERSION%-dev}.0"
          printf 'version=%s\nsource_ref=%s\nsource_sha=%s\nwindows_file_version=%s\ninstall_scope=user\ninstall_dir=%%LOCALAPPDATA%%\\Programs\\JayFlow\n' \
            "$VERSION" "$SOURCE_REF" "$SOURCE_SHA" "$WINDOWS_VERSION" > dist-windows/buildinfo.txt

          mapfile -d '' -t ACTUAL_ASSETS < <(find dist-windows -maxdepth 1 -type f -printf '%f\0' | sort -z)
          EXPECTED_ASSETS=(
            "JayFlow-${VERSION}-setup.exe"
            "JayFlow-${VERSION}.exe"
            JayFlow-setup.exe
            buildinfo.txt
          )
          if [ "${ACTUAL_ASSETS[*]}" != "${EXPECTED_ASSETS[*]}" ]; then
            echo "::error::unsigned artifact inventory differs from the exact allowlist"
            printf 'actual: %s\n' "${ACTUAL_ASSETS[*]}" >&2
            exit 1
          fi
          "$RUNNER_TEMP/jayflow-release-tool" audit-windows \
            -version "$VERSION" \
            -dir dist-windows \
            -daemon cmd/jayflow/embedded/jayflowd \
            -source-ref "$SOURCE_REF" \
            -source-sha "$SOURCE_SHA" \
            -public-key "$PUBLIC_KEY"

      - name: Upload the unsigned Windows internal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-release-assets
          path: source/dist-windows/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload the separately audited daemon artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audited-embedded-daemon
          path: source/cmd/jayflow/embedded/jayflowd
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build_linux:
    name: Validate and build Linux without the signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      ref: ${{ steps.inputs.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the public release repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: release
          persist-credentials: false

      - name: Validate release inputs
        id: inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-dev, without a v prefix or leading zeroes"
            exit 1
          fi
          VERSION_CORE="${INPUT_VERSION%-dev}"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION_CORE"
          for COMPONENT in "$VERSION_MAJOR" "$VERSION_MINOR" "$VERSION_PATCH"; do
            if [ "${#COMPONENT}" -gt 5 ] || (( 10#$COMPONENT > 65535 )); then
              echo "::error::each Windows version component must be in 0..65535"
              exit 1
            fi
          done

          EXPECTED_TAG="v${INPUT_VERSION}"
          if [ "$INPUT_REF" != "$EXPECTED_TAG" ]; then
            echo "::error::ref must be exactly v${INPUT_VERSION}"
            exit 1
          fi

          printf 'version=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the private source at the validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: julubileu/jayflow-v2
          ref: ${{ steps.inputs.outputs.ref }}
          ssh-key: ${{ secrets.JAYFLOW_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false

      - name: Record and verify source identity
        id: source
        working-directory: source
        env:
          SOURCE_REF: ${{ steps.inputs.outputs.ref }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${SOURCE_REF}^{commit}")"
          if [ "$SOURCE_SHA" != "$TAG_SHA" ] || [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::checkout HEAD does not resolve from the exact requested tag"
            exit 1
          fi
          git diff --check
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::source checkout contains untracked files"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::source checkout is dirty"
            exit 1
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Derive the reproducible source epoch
        working-directory: source
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_SHA")"
          if [[ ! "$SOURCE_DATE_EPOCH" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::source commit has no valid positive commit epoch"
            exit 1
          fi
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      - name: Set up Go from the private source go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Build the trusted public auditor
        working-directory: release
        run: |
          set -euo pipefail
          go test ./cmd/release-tool
          go build -trimpath -o "$RUNNER_TEMP/jayflow-release-tool" ./cmd/release-tool

      - name: Prepare the private source gate environment
        env:
          STRACE_URL: https://github.com/strace/strace/releases/download/v7.1/strace-7.1.tar.xz
          STRACE_SHA256: 81743ecf2a5b44186b2f5038afdc8beda7e5c70aed15b4fbfbcc6e9ece24490f
          STRACE_VERSION_LINE: strace -- version 7.1
          GATE_ROOT: ${{ runner.temp }}/jayflow-gate
        run: |
          set -euo pipefail

          STRACE_PREFIX="$RUNNER_TEMP/strace-7.1"
          STRACE_BIN="$STRACE_PREFIX/bin/strace"
          STRACE_SRC="$(mktemp -d)"
          trap 'rm -rf "$STRACE_SRC"' EXIT

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$STRACE_SRC/strace-7.1.tar.xz" "$STRACE_URL"
          printf '%s  %s\n' "$STRACE_SHA256" "$STRACE_SRC/strace-7.1.tar.xz" > "$STRACE_SRC/SHA256SUMS"
          sha256sum -c --strict "$STRACE_SRC/SHA256SUMS"

          tar -xf "$STRACE_SRC/strace-7.1.tar.xz" -C "$STRACE_SRC"
          (
            cd "$STRACE_SRC/strace-7.1"
            ./configure --prefix="$STRACE_PREFIX" --enable-mpers=no
            make -j"$(nproc)"
            make install
          )

          STRACE_VERSION_OUTPUT="$("$STRACE_BIN" -V)"
          BUILT_VERSION_LINE="$(printf '%s\n' "$STRACE_VERSION_OUTPUT" | head -1)"
          if [ "$BUILT_VERSION_LINE" != "$STRACE_VERSION_LINE" ]; then
            echo "::error::built tracer reports ${BUILT_VERSION_LINE}, want the pinned ${STRACE_VERSION_LINE}"
            exit 1
          fi
          MACHINE="$(uname -m)"
          if [ "$MACHINE" != x86_64 ]; then
            echo "::error::the pinned syscall table only covers x86_64, this runner is ${MACHINE}"
            exit 1
          fi

          mkdir -p "$GATE_ROOT/tasks"
          chmod 700 "$GATE_ROOT" "$GATE_ROOT/tasks"

          if ! unshare -U true; then
            RESTRICTED="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
            if [ "$RESTRICTED" = 1 ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if ! unshare -U true; then
              echo "::error::unprivileged CLONE_NEWUSER is unavailable, so the private gates cannot be proven"
              exit 1
            fi
          fi

          printf '%s\n' "$STRACE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Run focused Linux release gates
        working-directory: source
        env:
          JAYFLOW_LOCAL_GATE_ROOT: ${{ runner.temp }}/jayflow-gate
        run: |
          set -euo pipefail
          go test -race ./internal/updater ./internal/webservice ./internal/gateway ./internal/webserver ./cmd/jayflow-web -count=1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go vet ./cmd/jayflow-web ./internal/updater ./internal/webservice ./internal/gateway ./internal/webserver
          git diff --check
          git diff --exit-code

      - name: Build and audit reproducible Linux gateway
        working-directory: source
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUBLIC_KEY: ${{ vars.JAYFLOW_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::JAYFLOW_RELEASE_PUBLIC_KEY is not configured"
            exit 1
          fi
          git diff --check
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::source checkout contains untracked files before Linux build"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::source checkout is dirty before Linux build"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/linux-first" dist-linux
          build_gateway() {
            local output="$1"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true \
              -ldflags "-s -w -X main.Version=${VERSION} -X main.SourceSHA=${SOURCE_SHA} -X github.com/julubileu/jayflow-v2/internal/updater.PublicKeyBase64=${PUBLIC_KEY}" \
              -o "$output" ./cmd/jayflow-web
          }
          build_gateway "$RUNNER_TEMP/linux-first/jayflow-web-${VERSION}-linux-amd64"
          build_gateway "dist-linux/jayflow-web-${VERSION}-linux-amd64"
          if ! cmp -s "$RUNNER_TEMP/linux-first/jayflow-web-${VERSION}-linux-amd64" "dist-linux/jayflow-web-${VERSION}-linux-amd64"; then
            echo "::error::Linux gateway is not byte-for-byte reproducible"
            exit 1
          fi
          mapfile -d '' -t ACTUAL_ASSETS < <(find dist-linux -maxdepth 1 -type f -printf '%f\0' | sort -z)
          EXPECTED_ASSETS=("jayflow-web-${VERSION}-linux-amd64")
          if [ "${ACTUAL_ASSETS[*]}" != "${EXPECTED_ASSETS[*]}" ]; then
            echo "::error::Linux artifact inventory differs from the exact allowlist"
            printf 'actual: %s\n' "${ACTUAL_ASSETS[*]}" >&2
            exit 1
          fi
          GATEWAY="dist-linux/jayflow-web-${VERSION}-linux-amd64"
          if [ ! -s "$GATEWAY" ] || [ ! -x "$GATEWAY" ] || [ "$(stat -c '%a' "$GATEWAY")" != 755 ]; then
            echo "::error::Linux gateway must be non-empty with exact mode 0755"
            exit 1
          fi
          "$RUNNER_TEMP/jayflow-release-tool" audit-linux \
            -version "$VERSION" \
            -path "$GATEWAY" \
            -source-sha "$SOURCE_SHA" \
            -public-key "$PUBLIC_KEY"
          IDENTITY="$(dist-linux/jayflow-web-${VERSION}-linux-amd64 version --json)"
          python3 - "$IDENTITY" "$VERSION" "$SOURCE_SHA" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          want = {"version": sys.argv[2], "goos": "linux", "goarch": "amd64", "source_sha": sys.argv[3]}
          if value != want:
              raise SystemExit(f"gateway identity {value!r} != {want!r}")
          PY
          git diff --check
          git diff --exit-code

      - name: Upload the unsigned Linux gateway
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-linux-gateway
          path: source/dist-linux/jayflow-web-${{ steps.inputs.outputs.version }}-linux-amd64
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  accept_linux:
    name: Accept transported Linux bytes under real systemd and Playwright
    needs: build_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the private source from the Linux build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: julubileu/jayflow-v2
          ref: ${{ needs.build_linux.outputs.ref }}
          ssh-key: ${{ secrets.JAYFLOW_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false

      - name: Verify accepted source identity
        working-directory: source
        env:
          EXPECTED_REF: ${{ needs.build_linux.outputs.ref }}
          EXPECTED_SHA: ${{ needs.build_linux.outputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${EXPECTED_REF}^{commit}")"
          if [ "$SOURCE_SHA" != "$EXPECTED_SHA" ] || [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::acceptance source differs from build_linux"
            exit 1
          fi
          git diff --check
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::acceptance source checkout contains untracked files"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::acceptance source checkout is dirty"
            exit 1
          fi

      - name: Set up Go from the accepted source go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Build the trusted public auditor
        run: |
          set -euo pipefail
          go test ./cmd/release-tool
          go build -trimpath -o "$RUNNER_TEMP/jayflow-release-tool" ./cmd/release-tool

      - name: Download the transported Linux gateway
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-linux-gateway
          path: candidate

      - name: Build the acceptance daemon
        working-directory: source
        env:
          VERSION: ${{ needs.build_linux.outputs.version }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "$RUNNER_TEMP/jayflowd-acceptance" ./cmd/jayflowd
          "$RUNNER_TEMP/jayflow-release-tool" audit-daemon \
            -version "$VERSION" \
            -path "$RUNNER_TEMP/jayflowd-acceptance"

      - name: Audit transported Linux bytes
        env:
          VERSION: ${{ needs.build_linux.outputs.version }}
          SOURCE_SHA: ${{ needs.build_linux.outputs.source_sha }}
          PUBLIC_KEY: ${{ vars.JAYFLOW_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          chmod 0755 "candidate/jayflow-web-${VERSION}-linux-amd64"
          "$RUNNER_TEMP/jayflow-release-tool" audit-linux \
            -version "$VERSION" \
            -path "candidate/jayflow-web-${VERSION}-linux-amd64" \
            -source-sha "$SOURCE_SHA" \
            -public-key "$PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/cmd/jayflow/frontend/package-lock.json

      - name: Expose the runner browser as Chromium
        run: |
          set -euo pipefail
          CHROMIUM_SOURCE=""
          for CANDIDATE in \
            /usr/bin/google-chrome-stable \
            /usr/bin/google-chrome \
            /usr/bin/chromium; do
            if [ -x "$CANDIDATE" ]; then
              CHROMIUM_SOURCE="$CANDIDATE"
              break
            fi
          done
          if [ -z "$CHROMIUM_SOURCE" ]; then
            echo "::error::the official GitHub runner image has no supported Chromium/Chrome executable"
            exit 1
          fi
          if [ "$CHROMIUM_SOURCE" != /usr/bin/chromium ]; then
            sudo ln -sfn -- "$CHROMIUM_SOURCE" /usr/bin/chromium
          fi
          printf 'JAYFLOW_CHROMIUM=/usr/bin/chromium\n' >> "$GITHUB_ENV"
          /usr/bin/chromium --version

      - name: Install acceptance frontend dependencies
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --prefix cmd/jayflow/frontend --ignore-scripts --no-audit --no-fund

      - name: Run real-systemd and Playwright acceptance
        env:
          VERSION: ${{ needs.build_linux.outputs.version }}
          SOURCE_SHA: ${{ needs.build_linux.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACCEPTANCE_LOG="$RUNNER_TEMP/mobile-release-acceptance.log"
          sudo --preserve-env=JAYFLOW_CHROMIUM \
            source/tests/mobile-release-systemd.sh \
            --gateway "$PWD/candidate/jayflow-web-${VERSION}-linux-amd64" \
            --daemon "$RUNNER_TEMP/jayflowd-acceptance" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --playwright "$PWD/source/cmd/jayflow/frontend/scripts/mobile-release.playwright.mjs" \
            | tee "$ACCEPTANCE_LOG"
          REQUIRED_GATES=(
            "playwright: 390x844 layout PASS"
            "playwright: secure session and headers PASS"
            "playwright: websocket origin/token/limit PASS"
            "playwright: real PTY and replay PASS"
            "playwright: redaction PASS"
            "mobile-release playwright: PASS"
            "mobile-release systemd rollback: PASS"
            "mobile-release systemd: PASS"
          )
          for GATE in "${REQUIRED_GATES[@]}"; do
            grep -Fxq "$GATE" "$ACCEPTANCE_LOG" || {
              echo "::error::acceptance gate missing: ${GATE}"
              exit 1
            }
          done

  sign_publish:
    name: Sign and publish without private source
    needs: [build_windows, build_linux, accept_linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_REPO: julubileu/jayflow-releases
    steps:
      - name: Check out only the public release repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go for the trusted public tool
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test and compile the trusted public tool before secret injection
        run: |
          set -euo pipefail
          go test ./cmd/release-tool
          go build -trimpath -o "$RUNNER_TEMP/jayflow-release-tool" ./cmd/release-tool

      - name: Download the unsigned Windows internal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows-release-assets
          path: dist

      - name: Download the separate audited daemon artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audited-embedded-daemon
          path: internal-daemon

      - name: Download the unsigned Linux gateway
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-linux-gateway
          path: linux-dist

      - name: Reconcile independent build identities
        env:
          WINDOWS_VERSION: ${{ needs.build_windows.outputs.version }}
          LINUX_VERSION: ${{ needs.build_linux.outputs.version }}
          WINDOWS_REF: ${{ needs.build_windows.outputs.ref }}
          LINUX_REF: ${{ needs.build_linux.outputs.ref }}
          WINDOWS_SHA: ${{ needs.build_windows.outputs.source_sha }}
          LINUX_SHA: ${{ needs.build_linux.outputs.source_sha }}
        run: |
          set -euo pipefail
          [ "$WINDOWS_VERSION" = "$LINUX_VERSION" ] || { echo "::error::build versions differ"; exit 1; }
          [ "$WINDOWS_REF" = "$LINUX_REF" ] || { echo "::error::build refs differ"; exit 1; }
          [ "$WINDOWS_SHA" = "$LINUX_SHA" ] || { echo "::error::build source SHAs differ"; exit 1; }

      - name: Audit downloaded bytes before signing
        env:
          VERSION: ${{ needs.build_windows.outputs.version }}
          SOURCE_REF: ${{ needs.build_windows.outputs.ref }}
          SOURCE_SHA: ${{ needs.build_windows.outputs.source_sha }}
          PUBLIC_KEY: ${{ vars.JAYFLOW_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jayflow-release-tool" audit-windows \
            -version "$VERSION" \
            -dir dist \
            -daemon internal-daemon/jayflowd \
            -source-ref "$SOURCE_REF" \
            -source-sha "$SOURCE_SHA" \
            -public-key "$PUBLIC_KEY"
          chmod 0755 "linux-dist/jayflow-web-${VERSION}-linux-amd64"
          "$RUNNER_TEMP/jayflow-release-tool" audit-linux \
            -version "$VERSION" \
            -path "linux-dist/jayflow-web-${VERSION}-linux-amd64" \
            -source-sha "$SOURCE_SHA" \
            -public-key "$PUBLIC_KEY"
          cp "linux-dist/jayflow-web-${VERSION}-linux-amd64" dist/
          mapfile -d '' -t UNSIGNED_ASSETS < <(find dist -maxdepth 1 -type f -printf '%f\0' | sort -z)
          EXPECTED_UNSIGNED_ASSETS=(
            "JayFlow-${VERSION}-setup.exe"
            "JayFlow-${VERSION}.exe"
            JayFlow-setup.exe
            buildinfo.txt
            "jayflow-web-${VERSION}-linux-amd64"
          )
          if [ "${UNSIGNED_ASSETS[*]}" != "${EXPECTED_UNSIGNED_ASSETS[*]}" ]; then
            echo "::error::combined unsigned inventory differs from the exact five-file allowlist"
            printf 'actual: %s\n' "${UNSIGNED_ASSETS[*]}" >&2
            exit 1
          fi

      - name: Derive and verify the release public key
        id: signing
        env:
          JAYFLOW_RELEASE_PRIVATE_KEY: ${{ secrets.JAYFLOW_RELEASE_PRIVATE_KEY }}
          EXPECTED_PUBLIC_KEY: ${{ vars.JAYFLOW_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${JAYFLOW_RELEASE_PRIVATE_KEY:-}" ] || [ -z "${EXPECTED_PUBLIC_KEY:-}" ]; then
            echo "::error::release signing key or expected public key is not configured"
            exit 1
          fi
          PUBLIC_KEY="$("$RUNNER_TEMP/jayflow-release-tool" pubkey)"
          echo "::add-mask::$PUBLIC_KEY"
          if [ "$PUBLIC_KEY" != "$EXPECTED_PUBLIC_KEY" ]; then
            echo "::error::the signing key does not derive the configured public key"
            exit 1
          fi
          printf 'public_key=%s\n' "$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

      - name: Sign final bytes and generate authenticated metadata
        env:
          JAYFLOW_RELEASE_PRIVATE_KEY: ${{ secrets.JAYFLOW_RELEASE_PRIVATE_KEY }}
          VERSION: ${{ needs.build_windows.outputs.version }}
        run: |
          set -euo pipefail
          WINDOWS_URL="https://github.com/julubileu/jayflow-releases/releases/download/v${VERSION}/JayFlow-${VERSION}.exe"
          LINUX_URL="https://github.com/julubileu/jayflow-releases/releases/download/v${VERSION}/jayflow-web-${VERSION}-linux-amd64"
          "$RUNNER_TEMP/jayflow-release-tool" sign-bundle \
            -version "$VERSION" \
            -dir dist \
            -portable-url "$WINDOWS_URL" \
            -linux-url "$LINUX_URL"

      - name: Verify signed final bundle without the private key
        env:
          VERSION: ${{ needs.build_windows.outputs.version }}
          PUBLIC_KEY: ${{ steps.signing.outputs.public_key }}
        run: |
          set -euo pipefail
          unset JAYFLOW_RELEASE_PRIVATE_KEY
          WINDOWS_URL="https://github.com/julubileu/jayflow-releases/releases/download/v${VERSION}/JayFlow-${VERSION}.exe"
          LINUX_URL="https://github.com/julubileu/jayflow-releases/releases/download/v${VERSION}/jayflow-web-${VERSION}-linux-amd64"
          "$RUNNER_TEMP/jayflow-release-tool" verify-bundle \
            -version "$VERSION" \
            -dir dist \
            -portable-url "$WINDOWS_URL" \
            -linux-url "$LINUX_URL" \
            -public-key "$PUBLIC_KEY"

      - name: Create or reconcile the atomic public release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build_windows.outputs.version }}
          SOURCE_REF: ${{ needs.build_windows.outputs.ref }}
          SOURCE_SHA: ${{ needs.build_windows.outputs.source_sha }}
          PUBLIC_KEY: ${{ steps.signing.outputs.public_key }}
        run: |
          set -euo pipefail
          MIN_GH_VERSION=2.45.0
          GH_VERSION="$(gh --version | sed -nE '1s/^gh version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$GH_VERSION" ] || [ "$(printf '%s\n%s\n' "$MIN_GH_VERSION" "$GH_VERSION" | sort -V | head -n1)" != "$MIN_GH_VERSION" ]; then
            echo "::error::gh ${MIN_GH_VERSION} or newer is required"
            exit 1
          fi

          TAG="v${VERSION}"
          WINDOWS_URL="https://github.com/julubileu/jayflow-releases/releases/download/${TAG}/JayFlow-${VERSION}.exe"
          LINUX_URL="https://github.com/julubileu/jayflow-releases/releases/download/${TAG}/jayflow-web-${VERSION}-linux-amd64"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n%s\n%s\n%s\n' \
            "JayFlow ${VERSION}" \
            "Ed25519-authenticated SHA-256 metadata for the portable, both setup names, and buildinfo." \
            "Private source ref: ${SOURCE_REF}" \
            "Private source SHA: ${SOURCE_SHA}" > "$NOTES_FILE"

          EXPECTED_ASSETS=(
            "JayFlow-${VERSION}.exe"
            "JayFlow-${VERSION}-setup.exe"
            JayFlow-setup.exe
            buildinfo.txt
            release-manifest.json
            release-manifest.sig
            checksums.txt
            latest.json
            "jayflow-web-${VERSION}-linux-amd64"
            linux-latest.json
          )
          NON_CHANNEL_ASSETS=(
            "dist/JayFlow-${VERSION}.exe"
            "dist/JayFlow-${VERSION}-setup.exe"
            dist/JayFlow-setup.exe
            dist/buildinfo.txt
            "dist/jayflow-web-${VERSION}-linux-amd64"
            dist/release-manifest.json
            dist/release-manifest.sig
            dist/checksums.txt
          )

          read_release() {
            local VIEW_ERROR="$RUNNER_TEMP/gh-release-view.err"
            local VIEW_STATUS=0
            RELEASE_JSON="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft,assets 2>"$VIEW_ERROR")" \
              || VIEW_STATUS=$?
            if [ "$VIEW_STATUS" -ne 0 ]; then
              if [ "$VIEW_STATUS" -eq 1 ] && grep -Fiq 'release not found' "$VIEW_ERROR"; then
                return 2
              fi
              cat "$VIEW_ERROR" >&2
              return "$VIEW_STATUS"
            fi
            RELEASE_IS_DRAFT="$(RELEASE_JSON="$RELEASE_JSON" python3 -c 'import json,os; print(str(json.loads(os.environ["RELEASE_JSON"])["isDraft"]).lower())')"
            mapfile -t RELEASE_ASSETS < <(RELEASE_JSON="$RELEASE_JSON" python3 -c 'import json,os,sys; sys.stdout.write("\n".join(asset["name"] for asset in json.loads(os.environ["RELEASE_JSON"])["assets"]))')
            if [ "$RELEASE_IS_DRAFT" != true ] && [ "$RELEASE_IS_DRAFT" != false ]; then
              echo "::error::could not determine whether ${TAG} is a draft"
              exit 1
            fi
          }

          asset_is_expected() {
            local CANDIDATE="$1"
            local EXPECTED
            for EXPECTED in "${EXPECTED_ASSETS[@]}"; do
              [ "$CANDIDATE" = "$EXPECTED" ] && return 0
            done
            return 1
          }

          reject_unexpected_assets() {
            local ASSET
            for ASSET in "${RELEASE_ASSETS[@]}"; do
              if ! asset_is_expected "$ASSET"; then
                echo "::error::release ${TAG} contains unexpected asset ${ASSET}"
                exit 1
              fi
            done
          }

          require_exact_assets() {
            reject_unexpected_assets
            local EXPECTED
            for EXPECTED in "${EXPECTED_ASSETS[@]}"; do
              local FOUND=false
              local ASSET
              for ASSET in "${RELEASE_ASSETS[@]}"; do
                [ "$ASSET" = "$EXPECTED" ] && FOUND=true
              done
              if [ "$FOUND" != true ]; then
                echo "::error::release ${TAG} is missing expected asset ${EXPECTED}"
                exit 1
              fi
            done
            if [ "${#RELEASE_ASSETS[@]}" -ne "${#EXPECTED_ASSETS[@]}" ]; then
              echo "::error::release ${TAG} asset count differs from the allowlist"
              exit 1
            fi
          }

          RELEASE_EXISTS=false
          RELEASE_IS_DRAFT=false
          RELEASE_ASSETS=()
          READ_STATUS=0
          read_release || READ_STATUS=$?
          if [ "$READ_STATUS" -eq 0 ]; then
            RELEASE_EXISTS=true
          elif [ "$READ_STATUS" -ne 2 ]; then
            exit "$READ_STATUS"
          fi

          if [ "$RELEASE_EXISTS" = true ] && [ "$RELEASE_IS_DRAFT" = false ]; then
            require_exact_assets
            EXISTING_ASSETS_DIR="$(mktemp -d)"
            trap 'rm -rf "$EXISTING_ASSETS_DIR"' EXIT
            gh release download "$TAG" --repo "$GH_REPO" --dir "$EXISTING_ASSETS_DIR"
            "$RUNNER_TEMP/jayflow-release-tool" verify-bundle \
              -version "$VERSION" \
              -dir "$EXISTING_ASSETS_DIR" \
              -portable-url "$WINDOWS_URL" \
              -linux-url "$LINUX_URL" \
              -public-key "$PUBLIC_KEY"
            for ASSET in "${EXPECTED_ASSETS[@]}"; do
              if ! cmp -s "dist/${ASSET}" "$EXISTING_ASSETS_DIR/${ASSET}"; then
                echo "::error::published release ${TAG} is immutable and asset ${ASSET} differs"
                exit 1
              fi
            done
            gh release edit "$TAG" \
              --repo "$GH_REPO" \
              --title "JayFlow ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --draft=false \
              --prerelease=false \
              --latest
            exit 0
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            reject_unexpected_assets
          else
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "JayFlow ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --draft \
              --prerelease=false
          fi

          gh release upload "$TAG" "${NON_CHANNEL_ASSETS[@]}" --repo "$GH_REPO" --clobber
          gh release upload "$TAG" dist/latest.json --repo "$GH_REPO" --clobber
          gh release upload "$TAG" dist/linux-latest.json --repo "$GH_REPO" --clobber
          read_release
          if [ "$RELEASE_IS_DRAFT" != true ]; then
            echo "::error::release became public before final reconciliation"
            exit 1
          fi
          require_exact_assets
          REMOTE_VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$REMOTE_VERIFY_DIR"' EXIT
          gh release download "$TAG" --repo "$GH_REPO" --dir "$REMOTE_VERIFY_DIR"
          "$RUNNER_TEMP/jayflow-release-tool" verify-bundle \
            -version "$VERSION" \
            -dir "$REMOTE_VERIFY_DIR" \
            -portable-url "$WINDOWS_URL" \
            -linux-url "$LINUX_URL" \
            -public-key "$PUBLIC_KEY"
          for ASSET in "${EXPECTED_ASSETS[@]}"; do
            if ! cmp -s "dist/${ASSET}" "$REMOTE_VERIFY_DIR/${ASSET}"; then
              echo "::error::remote draft ${TAG} asset ${ASSET} differs after upload"
              exit 1
            fi
          done
          gh release edit "$TAG" \
            --repo "$GH_REPO" \
            --title "JayFlow ${TAG}" \
            --notes-file "$NOTES_FILE" \
            --draft=false \
            --prerelease=false \
            --latest
